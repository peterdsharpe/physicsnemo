project:
  type: book
  output-dir: _book

book:
  title: "Learning Boundary-to-Field Operators on Meshes"
  subtitle: "ISLA, measured against GeoTransolver on production aerodynamics"
  chapters:
    - index.qmd
    - part: "The problem and the architectures"
      chapters:
        - 01-problem.qmd
        - 02-meshtransformer2.qmd
        - 04-baselines-and-fair-comparison.qmd
    - part: "Evidence on production aerodynamics"
      chapters:
        - 03-benchmarks.qmd
        - 05-data-efficiency.qmd
        - 06-accuracy-and-robustness.qmd
        - 08-boundary-to-interior.qmd
    - part: "Limits and status"
      chapters:
        - 12-limits-and-directions.qmd
        - 13-program-status.qmd
  appendices:
    - 17-principled-decisions.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    html-math-method: mathjax
    code-fold: true
    mermaid:
      theme: neutral
