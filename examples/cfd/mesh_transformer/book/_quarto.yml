project:
  type: book
  output-dir: _book

book:
  title: "ISLA: Invariant Slice Attention for Boundary-to-Field Surrogates"
  subtitle: "A guide to the method, its use, and the evidence, measured against GeoTransolver and Transolver on production aerodynamics"
  chapters:
    - index.qmd
    - part: "I. The problem"
      chapters:
        - 01-problem.qmd
    - part: "II. The architecture"
      chapters:
        - 02-isla.qmd
        - 04-baselines-and-fair-comparison.qmd
    - part: "III. Using ISLA"
      chapters:
        - 09-using-isla.qmd
    - part: "IV. Evidence on production aerodynamics"
      chapters:
        - 03-benchmarks.qmd
        - 05-data-efficiency.qmd
        - 06-accuracy-and-robustness.qmd
        - 08-boundary-to-interior.qmd
    - part: "V. Limits and status"
      chapters:
        - 12-limits-and-directions.qmd
        - 13-program-status.qmd
  appendices:
    - 17-principled-decisions.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    html-math-method: mathjax
    code-fold: true
    mermaid:
      theme: neutral
