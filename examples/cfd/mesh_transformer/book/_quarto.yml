project:
  type: book
  output-dir: _book

book:
  title: "ISLA: Invariant Slice Attention for Boundary-to-Field Surrogates"
  subtitle: "A guide to the method, its use, and the evidence, measured against GeoTransolver and Transolver on production aerodynamics"
  chapters:
    - index.qmd
    - part: "I. The problem"
      chapters:
        - 01-problem.qmd
    - part: "II. The architecture"
      chapters:
        - 02-isla.qmd
        - 04-baselines-and-fair-comparison.qmd
    - part: "III. Using ISLA"
      chapters:
        - 09-using-isla.qmd
    - part: "IV. Evidence on production aerodynamics"
      chapters:
        - 03-benchmarks.qmd
        - 05-data-efficiency.qmd
        - 06-accuracy-and-robustness.qmd
        - 08-boundary-to-interior.qmd
    - part: "V. Limits and status"
      chapters:
        - 12-limits-and-directions.qmd
        - 13-program-status.qmd
  appendices:
    - 17-principled-decisions.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    css: book.css         # fit complete figures to their column, including Jupyter output with explicit pixel sizes
    grid:
      body-width: 1000px  # wider reading column; still responsive on small screens
      margin-width: 200px
    lightbox: true        # click a figure to inspect the full-resolution image
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    fig-width: 8
    fig-height: 4.5
    fig-dpi: 150
    fig-align: center
    html-math-method: mathjax
    mermaid:
      theme: neutral
