project:
  type: book
  output-dir: _book

book:
  title: "Learning Boundary-to-Interior Operators on Meshes"
  subtitle: "A falsification-driven research program on PDE surrogates"
  date: "2026-07-02"
  chapters:
    - index.qmd
    - 01-pde-theory.qmd
    - 02-architecture.qmd
    - 03-mesh-attention.qmd
    - 04-learned-bie.qmd
    - 05-parametric.qmd
    - 06-benchmarks.qmd
    - 07-laplace2d.qmd
    - 08-screened.qmd
    - 09-laplace3d.qmd
    - 10-liouville.qmd
    - 11-potential-flow.qmd
    - 12-euler-bernoulli.qmd
    - 13-euler-rotational.qmd
    - 14-navier-stokes.qmd
    - 15-airfrans.qmd
    - 16-drivaerml.qmd
    - 17-future.qmd
    - 18-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 4
    number-sections: true
    fig-align: center
    html-math-method: mathjax
    mermaid:
      theme: neutral
