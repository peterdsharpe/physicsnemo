project:
  type: book
  output-dir: _book

book:
  title: "Learning Boundary-to-Interior Operators on Meshes"
  subtitle: "A falsification-driven research program on PDE surrogates"
  date: "2026-07-02"
  chapters:
    - index.qmd
    - 01-pde-theory.qmd
    - 02-architecture.qmd
    - 03-mesh-attention.qmd
    - 04-learned-bie.qmd
    - 05-parametric.qmd
    - 06-benchmarks.qmd
    - 07-airfrans.qmd
    - 08-drivaerml.qmd
    - 09-future.qmd
    - 10-notebook.qmd

execute:
  echo: false
  warning: false
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 4
    number-sections: true
    fig-align: center
    html-math-method: mathjax
    mermaid:
      theme: neutral
