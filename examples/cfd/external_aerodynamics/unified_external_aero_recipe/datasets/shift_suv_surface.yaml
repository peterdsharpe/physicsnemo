# SHIFT-SUV surface dataset -- CROSS-FAMILY ZERO-SHOT TRANSFER EVAL ONLY
# (pre-registered @sec-nb-crossfamily-prereg, 2026-07-19).
# Derived from drivaer_ml_surface.yaml with the transform pipeline FROZEN
# (same nondim, same wss normalization std, same gauge, same subsampling);
# only the raw field names and the dataset root differ. Physics-semantics
# audit for fairness:
#   - L_ref = 5.0 m in both datasets -> the reference_length: 8.0 gauge
#     (40 m physical) carries over exactly.
#   - Pressure conventions are self-consistent per dataset: DrivAerML
#     stores gauge pressure with p_inf=0; SHIFT stores absolute pressure
#     with p_inf=101325 Pa. The shared (p - p_inf)/q_inf transform yields
#     proper Cp for both; no correction applied.
#   - U_inf: 38.89 m/s (DrivAerML) vs 30.0 m/s (SHIFT) -> Re differs
#     ~1.3x. The models' drive input is the unit direction only
#     (identical), and neither model receives Re; a mild covariate shift
#     identical for every model evaluated -- fair, and reported alongside
#     the geometry-family shift.
#   - Fields: pressure_average / wall_shear_stress_average are the
#     time-averaged analogues of DrivAerML's pMeanTrim /
#     wallShearStressMeanTrim (SI units verified via units.json + memmap
#     range checks).
train_datadir: ${dataset_paths.shift_suv}

pipeline:
  reader:
    _target_: ${dp:MeshReaderWithGlobalData}
    path: ${train_datadir}
    pattern: "run_*/*.pdmsh/_tensordict/boundaries/vehicle"
    subsample_n_cells: ${sampling_resolution}
    # Walk up two levels from the boundary tensordict to the parent
    # DomainMesh's global_data and merge its keys onto each sample.
    merge_global_data_from: "../../global_data"
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      axes: ["z"]
      transform_cell_data: true
      transform_global_data: true
    - _target_: ${dp:RandomTranslateMesh}
      distribution:
        _target_: torch.distributions.Uniform
        low: [-1.0, -1.0, 0.0]
        high: [1.0, 1.0, 0.0]
  transforms:
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    # Unit freestream direction as a NEW global leaf `U_inf_dir` (`U_inf`
    # stays physical, so inference-side re-dimensionalization is
    # unaffected). Consumed as the nondimensional rank-1 drive by the
    # MeshTransformer templates; inert for models that don't declare it.
    # Placed before CenterMesh so the rotation augmentation
    # (transform_global_data: true, inserted after CenterMesh) rotates it
    # together with U_inf and the geometry.
    - _target_: ${dp:ComputeFreestreamDirection}
      velocity_field: U_inf
      output_field: U_inf_dir
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        pressure_average: pressure
        wall_shear_stress_average: stress
      association: cell_data
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        pressure_average: pressure
        wall_shear_stress_average: wss
    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00313}
    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: normals
    - _target_: ${dp:SubsampleMesh}
      n_cells: ${sampling_resolution}
    # Constant scale gauge for models that declare an explicit reference
    # length read from global_data (the MeshTransformer templates'
    # `reference_length_key: reference_length`). The value is in the
    # already-L_ref-nondimensionalized coordinate space (positions were
    # divided by the per-case `L_ref`=5 m above), so 8.0 means a physical
    # gauge of 40 m -- the tunnel scale, approximately the measure-weighted
    # RMS radius of the FULL DrivAerML boundary set (vehicle + ground +
    # walls + inlet/outlet), which is the source-normalization operating
    # point the MeshTransformer is designed around. The same constant is
    # injected by drivaer_ml_surface_allbc.yaml so the gauge is identical
    # across the vehicle-only and all-boundaries arms; a vehicle-scale
    # gauge (1.0 here) overflows the all-boundary arm's norm-free drive
    # stream to NaN at initialization (measured dose-response: NaN at 1,
    # ~1e24 at 2, healthy for >= 6). Inert for every model that does not
    # declare it (the raw `L_ref` in global_data is untouched, so
    # inference-side re-dimensionalization is unaffected).
    - _target_: ${dp:SetGlobalField}
      fields:
        reference_length: 8.0
    # Terminal transform: convert the surface Mesh into a DomainMesh per the
    # recipe's prediction-vs-input contract. `interior` becomes a Mesh[0, 3]
    # point cloud at the cell centroids (where the model predicts), with the
    # target fields moved into `interior.point_data`. `boundaries.vehicle` is
    # the original triangulated surface, with non-target cell features
    # (normals) preserved on the boundary's cell_data. The dataset builder
    # auto-injects `cell_data_targets` from the `targets:` block below.
    - _target_: ${dp:MeshToDomainMesh}
      interior_points: cell_centroids

# Single source of truth for prediction field names + types. Read by both the
# dataset builder (auto-injected into MeshToDomainMesh above) and the train
# loop (used to build LossCalculator and MetricCalculator).
targets:
  pressure: scalar
  wss: vector
