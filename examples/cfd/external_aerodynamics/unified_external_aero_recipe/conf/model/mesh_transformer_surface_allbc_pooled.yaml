# ---------------------------------------------------------------------------
# MeshTransformer template -- all-typed-boundaries arm + per-boundary
# moment pool.
# ---------------------------------------------------------------------------
# Identical to mesh_transformer_surface_allbc.yaml except for the single
# knob `per_boundary_moment_pool: true`.
#
# WHY (probe verdict, run_1 trained checkpoint, epoch 476): the encoder
# attention moments are quadrature-weighted with raw cell measures, and
# the tunnel panels carry ~1e6x the vehicle's measure -- the measured
# tunnel/vehicle moment-contribution ratio moved only 2.2e7 -> 1.0e7
# (operator stream) and 6.3e7 -> 4.3e7 (drive stream) in 500 epochs: the
# model won ~20x of the needed ~1e7 suppression through the value
# features.  The pool computes each boundary's moments separately and
# recombines them through learned dimensionless per-boundary/per-head
# log-gains (Green's identity splits over boundary components, so this is
# exact structure), turning that multiplicative fight into an additive
# shift of a log-scale parameter.  Gains are zero-initialized: at init
# this arm is the plain allbc arm exactly (up to float summation order).
#
#   python src/train.py model=mesh_transformer_surface_allbc_pooled \
#       dataset=drivaer_ml_surface_allbc compile=false \
#       'training.field_weights={pressure: 1.0, wss: 100.0}' \
#       sampling_resolution=50000
#
# See mesh_transformer_surface_allbc.yaml for the boundary schema, gauge,
# and drive documentation (this file keeps the templates diffable
# field-for-field).
input_type: mesh
output_type: mesh

forward_kwargs:
  domain: ""                       # "" resolves to the DomainMesh sample itself

model:
  _target_: physicsnemo.experimental.nn.MeshTransformer
  n_spatial_dims: 3
  output_field_ranks:
    pressure: 0                    # scalar (Cp at surface centroids)
    wss: 1                         # vector (Cf at surface centroids)
  boundary_field_ranks:
    # All five typed boundaries, geometry-only. Distinct names = distinct
    # BC types (per-boundary one-hot in the operator state).
    vehicle: {operator: {}, drive: {}}
    no_slip: {operator: {}, drive: {}}
    slip: {operator: {}, drive: {}}
    inlet: {operator: {}, drive: {}}
    outlet: {operator: {}, drive: {}}
  global_field_ranks:
    operator: {}
    drive:
      U_inf_dir: 1                 # unit freestream direction, the rank-1 global drive
  reference_length_key: reference_length  # constant 8.0 in L_ref units (see header)
  field_mode: zero_preserving_nonlinear
  query_decoder: kernel
  # Two-member "singpair" kernel dictionary (reference configuration).
  kernel_mlp_members: 0
  kernel_include_polynomial_members: false
  kernel_include_single_layer_member: true
  kernel_monopole_free_single_layer: false
  # MANDATORY at recipe scale for training memory (see the surface template).
  kernel_checkpoint_query_chunks: true
  # THE ARM'S SINGLE DELTA: per-boundary attention moments combined by
  # learned dimensionless log-gains (see header for the probe verdict).
  per_boundary_moment_pool: true
  # Reference capacity: one encoder layer, one full-width head.
  operator_scalar_dim: 32
  operator_vector_dim: 8
  drive_scalar_dim: 48
  drive_vector_dim: 12
  operator_layers: 1
  drive_layers: 1
  query_layers: 1
  heads: 1
  scalar_rank: 48
  vector_rank: 16
  query_chunk_size: 65536
  attention_chunk_size: 65536
