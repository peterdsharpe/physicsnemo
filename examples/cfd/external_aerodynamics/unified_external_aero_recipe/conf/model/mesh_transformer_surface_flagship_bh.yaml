# ---------------------------------------------------------------------------
# MeshTransformer -- SURFACE recipe, flagship + Barnes--Hut decode (task #41
# acceptance C).
# ---------------------------------------------------------------------------
# EXACT copy of mesh_transformer_surface_flagship.yaml except the decode
# backend block at the bottom: hierarchical (Barnes--Hut) kernel decode at
# the pre-registered production theta.  Acceptance C (training neutrality):
# this arm at matched seed must track the dense flagship's val curve within
# seed noise over the first 100 epochs; do NOT ship the backend to fleet
# lanes unless it does.
# NOTE kernel_checkpoint_query_chunks is false here (BH v1 rejects the
# dense-path checkpoint packing; BH's own memory is bounded by the fold
# block, not the pair count).
input_type: mesh
output_type: mesh

forward_kwargs:
  domain: ""                       # "" resolves to the DomainMesh sample itself

model:
  _target_: physicsnemo.experimental.nn.MeshTransformer
  n_spatial_dims: 3
  output_field_ranks:
    pressure: 0                    # scalar (Cp at surface centroids)
    wss: 1                         # vector (Cf at surface centroids)
  boundary_field_ranks:
    vehicle: {operator: {}, drive: {}}   # geometry-only boundary input
  global_field_ranks:
    operator: {}
    drive:
      U_inf_dir: 1                 # unit freestream direction, the rank-1 global drive
  reference_length_key: reference_length  # constant 8.0 in L_ref units (see base arm)
  field_mode: zero_preserving_nonlinear
  query_decoder: kernel
  trace_of: vehicle
  kernel_mlp_members: 8
  kernel_include_polynomial_members: false
  kernel_include_single_layer_member: true
  kernel_monopole_free_single_layer: false
  kernel_checkpoint_query_chunks: false
  operator_scalar_dim: 64
  operator_vector_dim: 16
  drive_scalar_dim: 96
  drive_vector_dim: 24
  operator_layers: 2
  drive_layers: 1
  query_layers: 1
  heads: 1
  scalar_rank: 96
  vector_rank: 32
  query_chunk_size: 65536
  attention_chunk_size: 65536
  # --- The single delta vs the dense flagship (task #41) ---
  kernel_decode_backend: barnes_hut
  kernel_bh_theta: 0.5
  kernel_bh_leaf_size: 32
