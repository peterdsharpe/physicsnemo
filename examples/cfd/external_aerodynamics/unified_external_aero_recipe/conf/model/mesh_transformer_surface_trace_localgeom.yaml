# ---------------------------------------------------------------------------
# MeshTransformer -- SURFACE recipe, trace arm + LOCAL-GEOMETRY DIAGNOSTIC.
# ---------------------------------------------------------------------------
# CONTRACT-BREAKING DIAGNOSTIC, NEVER A KEEPER (pre-registered as probe P2
# of the H-C decomposition, mesh_transformer book 18-notebook.qmd
# @sec-nb-aga-fleet).  Identical to mesh_transformer_surface_trace.yaml
# plus exactly one knob: diagnostic_local_query_features, which hands each
# trace query its own cell's local geometry (unit normal, log relative
# area, nondimensional curvature) directly instead of through the
# boundary-integral information diet.  Equivariance and similarity
# contracts survive (features are typed/invariant); the INFORMATION
# contract is deliberately broken.  Read-out: if this arm recovers most of
# GeoTransolver's early-epoch efficiency (val at epochs 1/5/25), the
# efficiency lives in local-geometry shortcuts and the principled response
# is a declared local corrector.  This config must never become a default
# or a benchmark arm.
input_type: mesh
output_type: mesh

forward_kwargs:
  domain: ""                       # "" resolves to the DomainMesh sample itself

model:
  _target_: physicsnemo.experimental.nn.MeshTransformer
  n_spatial_dims: 3
  output_field_ranks:
    pressure: 0                    # scalar (Cp at surface centroids)
    wss: 1                         # vector (Cf at surface centroids)
  boundary_field_ranks:
    vehicle: {operator: {}, drive: {}}   # geometry-only boundary input
  global_field_ranks:
    operator: {}
    drive:
      U_inf_dir: 1                 # unit freestream direction, the rank-1 global drive
  reference_length_key: reference_length  # constant 8.0 in L_ref units (see base arm)
  field_mode: zero_preserving_nonlinear
  query_decoder: kernel
  # THE declared boundary-trace mode: queries ARE the vehicle's cell
  # centroids (see header).  The single delta against the plain arm.
  trace_of: vehicle
  # THE diagnostic knob (see header).  Requires trace_of.
  diagnostic_local_query_features: true
  # Two-member "singpair" kernel dictionary (reference configuration).
  kernel_mlp_members: 0
  kernel_include_polynomial_members: false
  kernel_include_single_layer_member: true
  # A car in a tunnel is not a zero-net-flux exterior; the monopole
  # deflation's physics license does not hold here.
  kernel_monopole_free_single_layer: false
  # MANDATORY at recipe scale for training memory (see base arm).
  kernel_checkpoint_query_chunks: true
  # Reference capacity: one encoder layer, one full-width head.
  operator_scalar_dim: 32
  operator_vector_dim: 8
  drive_scalar_dim: 48
  drive_vector_dim: 12
  operator_layers: 1
  drive_layers: 1
  query_layers: 1
  heads: 1
  scalar_rank: 48
  vector_rank: 16
  query_chunk_size: 65536
  attention_chunk_size: 65536
