# ---------------------------------------------------------------------------
# MeshTransformer -- SURFACE recipe, FLAGSHIP (canonical configuration).
# ---------------------------------------------------------------------------
# The one configuration every current claim cites. Composition of the
# individually-confirmed DrivAerML mechanisms (boundary-trace queries,
# members-8 kernel dictionary, wide dims/ranks, operator_layers 2 --
# lineage: the task #52/#53 probe-wave arms, since pruned from conf/) plus
# the two conventions the model-quality agenda earned in 2026-08:
# measure-consistent quadrature (dataset-side) and the degree-one
# homogeneous field mode (below). History: program notebook,
# sec-nb-bounded-stage1-verdict and the archived chronology.
input_type: mesh
output_type: mesh

forward_kwargs:
  domain: ""                       # "" resolves to the DomainMesh sample itself

model:
  _target_: physicsnemo.experimental.nn.MeshTransformer
  n_spatial_dims: 3
  output_field_ranks:
    pressure: 0                    # scalar (Cp at surface centroids)
    wss: 1                         # vector (Cf at surface centroids)
  boundary_field_ranks:
    vehicle: {operator: {}, drive: {}}   # geometry-only boundary input
  global_field_ranks:
    operator: {}
    drive:
      U_inf_dir: 1                 # unit freestream direction, the rank-1 global drive
  reference_length_key: reference_length  # constant 8.0 in L_ref units (see base arm)
  # Degree-one homogeneous read-in: the stage-1 2x2 (2026-08-06) showed the
  # zero_preserving_nonlinear mode's implicit drive degree is the root cause
  # of foreign-family detonation; declaring degree one removes it for
  # 1.03-1.13x in-family cost with resolution transfer intact.
  field_mode: homogeneous
  query_decoder: kernel
  # THE declared boundary-trace mode: queries ARE the vehicle's cell
  # centroids (see header).  The single delta against the plain arm.
  trace_of: vehicle
  # Two-member "singpair" kernel dictionary (reference configuration).
  kernel_mlp_members: 8
  kernel_include_polynomial_members: false
  kernel_include_single_layer_member: true
  # A car in a tunnel is not a zero-net-flux exterior; the monopole
  # deflation's physics license does not hold here.
  kernel_monopole_free_single_layer: false
  # MANDATORY at recipe scale for training memory (see base arm).
  kernel_checkpoint_query_chunks: true
  # Reference capacity: one encoder layer, one full-width head.
  operator_scalar_dim: 64
  operator_vector_dim: 16
  drive_scalar_dim: 96
  drive_vector_dim: 24
  operator_layers: 2
  drive_layers: 1
  query_layers: 1
  heads: 1
  scalar_rank: 96
  vector_rank: 32
  query_chunk_size: 65536
  attention_chunk_size: 65536
