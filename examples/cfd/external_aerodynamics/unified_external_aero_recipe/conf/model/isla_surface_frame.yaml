# ---------------------------------------------------------------------------
# ISLA -- SURFACE recipe with a SUPPLIED frame (FRAME-FULL, 2026-09-10).
# ---------------------------------------------------------------------------
# isla_surface.yaml with the constant-gauge frame read from global_data
# instead of estimated from the sampled points: the dataset pipeline injects
# the area-weighted centroid (and RMS radius) of the FULL boundary surface per
# case via SetGlobalFieldsFromTable, so the frame has no sampling dependence
# and no estimator variance. Arm A (center only) is this file; arm B (center +
# scale) adds `model.scale_mode=global`.
input_type: tensors
output_type: tensors

forward_kwargs:
  points: interior.points
  normals: boundaries.vehicle.cell_data.normals
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  measure_weights: interior.point_data._target_quadrature_measure
  frame_center: global_data.frame_center
  frame_scale: global_data.frame_scale

model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 1                 # pressure
  out_vectors: 1                 # wss
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  center_mode: global
  # Constant scale gauge (arm A); arm B overrides scale_mode=global and reads
  # frame_scale instead.
  reference_length: 8.0
  # Prior (constant-gauge) frame, pinned explicitly: since 2026-09-11 the class
  # defaults are frame_mode=relative and scale_mode=total_measure (the
  # reference configuration, conf/model/isla_surface_reference.yaml).
  frame_mode: centered
  scale_mode: reference_length
  geo_checkpoint: true
