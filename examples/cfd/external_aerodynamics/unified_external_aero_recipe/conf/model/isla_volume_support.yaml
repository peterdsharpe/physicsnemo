# ISLA on the boundary->interior task with a per-case computational SUPPORT
# (transfer program D1, 2026-09-09). Surface tokens (vehicle cells) and the
# support points (`boundaries.support`, produced by the dataset's
# SplitInteriorSupport transform, carrying the signed distance and its gradient)
# interact in the 12 encoder layers; the requested interior points
# (`interior.points`) are decoded PASSIVELY through `n_decoder_layers` read
# blocks with the same signed-distance inputs. A prediction at a query cannot
# depend on which other queries are requested. Use with dataset
# drivaer_ml_volume_support. Every architecture receives the freestream as the
# unit direction (protocol rule after UDRV). The interior reference
# configuration is isla_volume.yaml; this file is the research variant behind
# the transfer program's computational-support study.

input_type: tensors
output_type: tensors
# Learning rate pinned at ISLA's protocol rate (the recipe default of 3e-3
# collapses the relative frame; book notebook: lrref-verdict; see isla_surface.yaml).
training:
  optimizer:
    lr: 1.0e-3
forward_kwargs:
  points: boundaries.vehicle.cell_centroids
  normals: boundaries.vehicle.cell_data.normals
  measure_weights: boundaries.vehicle.cell_data.areas
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  support_points: boundaries.support.points
  support_normals: boundaries.support.point_data.sdf_normals
  support_scalars: boundaries.support.point_data.sdf
  query_points: interior.points
  query_normals: interior.point_data.sdf_normals
  query_scalars: interior.point_data.sdf
model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 2                 # pressure, nut (DrivAerML volume targets)
  out_vectors: 1                 # velocity
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  reference_length: 8.0
  # Prior (constant-gauge) frame, pinned explicitly: the class defaults are
  # frame_mode=relative and scale_mode=rms_distance (the reference
  # configuration, conf/model/isla_surface.yaml; total_measure until 2026-09-18).
  frame_mode: centered
  scale_mode: reference_length
  similarity_gauge: true
  geo_checkpoint: true
  # Geometry kernel: null = automatic (2026-09-19 ruling): the exact fused Triton kernel
  # wherever it can run (CUDA, one global vector, <= 1024 slices; about a third of the eager
  # step time and memory at 200,000 cells), the eager PyTorch region otherwise. Force with
  # `eager` or `fused`.
  geo_kernel: null
  # Support/passive split (default off in the class; on here).
  query_independent: true
  support_tokens: true
  n_decoder_layers: 12          # SUPPORT-12; set 4 for the SUPPORT-4 arm
  n_query_scalars: 1            # signed distance at support and query points
  query_scalar_scale: length
  query_mass: source_total      # support mass invariant to source refinement
