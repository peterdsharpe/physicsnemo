# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- SURFACE recipe.
# ---------------------------------------------------------------------------
# Thesis-killer configuration (prereg mt2_stage0, sha c73bf8b6): invariant
# soft-slice backbone at GT-matched scale (~8.5M params), exact similarity
# equivariance / measure-aware aggregation by construction
# (contract unit tests gate launch). Consumes the same DomainMesh paths as
# the GeoTransolver template plus the recorded target quadrature measure.
input_type: tensors
output_type: tensors

forward_kwargs:
  points: interior.points
  normals: boundaries.vehicle.cell_data.normals
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  measure_weights: interior.point_data._target_quadrature_measure

model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 1                 # pressure
  out_vectors: 1                 # wss
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  # Constant scale gauge (reference_length 8.0 in the L_ref-nondimensional frame)
  # (see drivaer_ml_surface.yaml for the calibration rationale).
  reference_length: 8.0
  # Prior (constant-gauge) frame, pinned explicitly: since 2026-09-11 the class
  # defaults are frame_mode=relative and scale_mode=total_measure (the
  # reference configuration, conf/model/isla_surface_reference.yaml).
  frame_mode: centered
  scale_mode: reference_length
  # Rebuild the per-slice geometric invariants inside backward instead of
  # storing them: forward and gradients bitwise identical, peak training
  # memory 2.3x lower (1.5 GB vs 3.5 GB at 10k tokens, RTX 4090 bf16) for a
  # 1.16x step time. Set false to trade memory for speed.
  geo_checkpoint: true
