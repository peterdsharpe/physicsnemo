# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- SURFACE recipe (reference configuration).
# ---------------------------------------------------------------------------
# The ISLA reference configuration (decided 2026-09-11): the relative frame
# with the RMS-pairwise-distance length unit. Positions enter only through
# point-to-anchor differences (frame_mode=relative: no centroid and no
# per-sample frame anywhere in the forward pass), and the length unit is the
# measure-weighted root-mean-square pairwise distance of the sampled surface
# (scale_mode=rms_distance: normalized, center-free, finite on any boundary
# with a finite second moment; validated against the total-measure unit on
# 2026-09-18, LEN-RMS, within 1.3%), so no per-dataset reference length is
# needed. scale_mode=total_measure (the square root of the total quadrature
# measure) remains an option and is the unit of runs trained before then.
# Translation invariance is exact without centering; the frame carries no
# information about where the mesher put its cells. Both settings are also the
# class defaults and are stated here explicitly. Checkpoints store their constructor arguments, so
# models saved under other settings load unchanged.
#
# Consumes the same DomainMesh paths as the GeoTransolver template plus the
# recorded target quadrature measure (measure_weights). The freestream
# direction is external aerodynamics' one global vector input (K = 1); other
# PDEs pass their own global vectors and global scalars (see the ISLA class
# docstring).
#
# Variant: isla_surface_constant_gauge.yaml (centered frame with a fixed
# reference length; the configuration before 2026-09-11, kept as an ablation).
# Naming note: until 2026-09-15 this file carried the constant gauge and the
# reference configuration lived in isla_surface_reference.yaml, which is now a
# pointer to this file.
input_type: tensors
output_type: tensors

# Learning rate (protocol, 2026-09-17; ceiling measured 2026-09-18): 1e-3 at
# hidden 192. Pinned here because the recipe's default of 3e-3 (GeoTransolver's)
# collapses ISLA within five epochs to a mean-field plateau (validation loss
# 0.06 against 0.0008 at 1e-3; book notebook: lrref-verdict) and 1e-2 diverges.
# Above hidden 192 use the width rule lr = 1e-3 x 192 / hidden (3.75e-4 at 512):
# at width 512 the relative frame diverges at 1e-3 (routing hardens to one slice
# per token), trains cleanly under the rule, and the rule costs the centered
# variant nothing (notebook: relframe-divergence, corner-wlr, cg-wlr verdicts).
# A CLI override still wins.
training:
  optimizer:
    lr: 1.0e-3

forward_kwargs:
  points: interior.points
  normals: boundaries.vehicle.cell_data.normals
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  measure_weights: interior.point_data._effective_measure

model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 1                 # pressure
  out_vectors: 1                 # wss
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  frame_mode: relative
  scale_mode: rms_distance
  # Rebuild the per-slice geometric invariants inside backward instead of
  # storing them: forward and gradients bitwise identical, lower peak training
  # memory for a modest step-time cost. Set false to trade memory for speed.
  geo_checkpoint: true
  # Geometry kernel: null = automatic (2026-09-19 ruling): the exact fused Triton kernel
  # wherever it can run (CUDA, one global vector, <= 1024 slices; about a third of the eager
  # step time and memory at 200,000 cells), the eager PyTorch region otherwise. Force with
  # `eager` or `fused`.
  geo_kernel: null
