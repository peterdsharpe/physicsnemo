# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- SURFACE recipe (reference configuration).
# ---------------------------------------------------------------------------
# The ISLA reference configuration (decided 2026-09-11): the relative frame
# with the total-measure scale. Positions enter only through point-to-anchor
# differences (frame_mode=relative: no centroid and no per-sample frame
# anywhere in the forward pass), and the length unit is the square root of
# the total quadrature measure of the sampled surface (scale_mode=total_measure),
# so no per-dataset reference length is needed. Translation invariance is
# exact without centering; the frame carries no information about where the
# mesher put its cells. Both settings are also the class defaults and are
# stated here explicitly. Checkpoints store their constructor arguments, so
# models saved under other settings load unchanged.
#
# Consumes the same DomainMesh paths as the GeoTransolver template plus the
# recorded target quadrature measure (measure_weights). The freestream
# direction is external aerodynamics' one global vector input (K = 1); other
# PDEs pass their own global vectors and global scalars (see the ISLA class
# docstring).
#
# Variant: isla_surface_constant_gauge.yaml (centered frame with a fixed
# reference length; the configuration before 2026-09-11, kept as an ablation).
# Naming note: until 2026-09-15 this file carried the constant gauge and the
# reference configuration lived in isla_surface_reference.yaml, which is now a
# pointer to this file.
input_type: tensors
output_type: tensors

forward_kwargs:
  points: interior.points
  normals: boundaries.vehicle.cell_data.normals
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  measure_weights: interior.point_data._target_quadrature_measure

model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 1                 # pressure
  out_vectors: 1                 # wss
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  frame_mode: relative
  scale_mode: total_measure
  # Rebuild the per-slice geometric invariants inside backward instead of
  # storing them: forward and gradients bitwise identical, lower peak training
  # memory for a modest step-time cost. Set false to trade memory for speed.
  geo_checkpoint: true
