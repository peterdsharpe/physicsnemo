# ---------------------------------------------------------------------------
# ISLA -- INTERIOR (volume) recipe (reference configuration).
# ---------------------------------------------------------------------------
# Boundary -> interior on DrivAerML volume data (decided 2026-09-14, book
# notebook #sec-nb-relint-verdict): the interior query points are admitted as
# interacting tokens that carry the signed distance to the wall and its
# gradient, on the same frame-free construction as the surface configuration
# (isla_surface.yaml): frame_mode=relative (no centroid anywhere; positions
# enter only as point-to-anchor differences) and scale_mode=rms_distance
# (length unit = measure-weighted RMS pairwise distance of the boundary
# sample; scale_mode=total_measure, the square root of the total boundary
# quadrature measure, remains an option and is the unit of runs before
# 2026-09-18).
#
# Both units need measure weights whose sum is the surface
# area. A subsampled boundary's raw cell_areas sum to the kept fraction of
# it, so this config reads the Horvitz-Thompson-corrected measure written by
# the ComposeQuadratureMeasure transform of datasets/drivaer_ml_volume_reference.yaml
# (notebook #sec-nb-relint-void for what goes wrong without it). Pair this
# model config with that dataset config.
#
# Standing (float32, 48 DrivAerML validation cars, 10,000 queries, two seeds,
# results/relint2_reduction_2026-09-14.json): pressure 0.0550, velocity 0.0782,
# eddy viscosity 0.1005; 1.000x / 0.990x / 0.880x of the similarity-gauge
# interior configuration it replaces.
# Naming note: until 2026-09-15 this file was isla_volume_reference.yaml, which
# is now a pointer to this file.
input_type: tensors
output_type: tensors

# Learning rate pinned at ISLA's protocol rate: the recipe default of 3e-3
# collapses the relative frame to a mean-field plateau at width 192 (book
# notebook: lrref-verdict; see isla_surface.yaml). Width rule above 192.
training:
  optimizer:
    lr: 1.0e-3

forward_kwargs:
  points: boundaries.vehicle.cell_centroids
  normals: boundaries.vehicle.cell_normals
  measure_weights: boundaries.vehicle.cell_data.quadrature_measure
  global_vectors: global_data.U_inf_dir   # the one global vector input of external aerodynamics: the freestream direction
  query_points: interior.points
  query_normals: interior.point_data.sdf_normals
  query_scalars: interior.point_data.sdf

model:
  _target_: physicsnemo.experimental.nn.ISLA
  out_scalars: 2                 # pressure, nut (dataset targets: scalars first)
  out_vectors: 1                 # velocity
  hidden: 192
  n_layers: 12
  n_slices: 256
  mlp_ratio: 4
  frame_mode: relative
  scale_mode: rms_distance
  query_tokens: true
  n_query_scalars: 1
  geo_checkpoint: true
