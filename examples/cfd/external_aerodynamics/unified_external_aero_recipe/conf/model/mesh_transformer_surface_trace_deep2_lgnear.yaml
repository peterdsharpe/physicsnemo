# ---------------------------------------------------------------------------
# MeshTransformer -- SURFACE recipe, local-corrector probe arm: lgnear (probe B).
# ---------------------------------------------------------------------------
# Task #53 probe ladder (pre-registered in the program notebook before
# launch): near-field-only support -- same channels under a C^1 smoothstep,
# exactly zero beyond the subtended-angle threshold. Prediction:
# retains >=80% of probe A gain; falsifier: needs far pairs =>
# mechanism not local, corrector framing dies
# Base: trace_deep2 (current best rung) + kernel_mlp_members: 8 (the
# probe features feed the smooth-member MLP, which needs a carrier).
# The matched within-wave control is
# mesh_transformer_surface_trace_deep2_members.yaml (same base, no
# probe block).
input_type: mesh
output_type: mesh

forward_kwargs:
  domain: ""                       # "" resolves to the DomainMesh sample itself

model:
  _target_: physicsnemo.experimental.nn.MeshTransformer
  n_spatial_dims: 3
  output_field_ranks:
    pressure: 0                    # scalar (Cp at surface centroids)
    wss: 1                         # vector (Cf at surface centroids)
  boundary_field_ranks:
    vehicle: {operator: {}, drive: {}}   # geometry-only boundary input
  global_field_ranks:
    operator: {}
    drive:
      U_inf_dir: 1                 # unit freestream direction, the rank-1 global drive
  reference_length_key: reference_length  # constant 8.0 in L_ref units (see base arm)
  field_mode: zero_preserving_nonlinear
  query_decoder: kernel
  # THE declared boundary-trace mode: queries ARE the vehicle's cell
  # centroids (see header).  The single delta against the plain arm.
  trace_of: vehicle
  # Two-member "singpair" kernel dictionary (reference configuration).
  kernel_mlp_members: 8
  kernel_local_pair_features: near_only
  # theta_c = 0.1: uniform-mesh estimate puts ~12.6% of pairs inside the
  # window support at sampling_resolution=10000 (target 5-15%; theta_c=0.25
  # would give ~2%).  Verify on-cluster with scratch/measure_near_fraction.py.
  kernel_near_theta: 0.1
  kernel_include_polynomial_members: false
  kernel_include_single_layer_member: true
  # A car in a tunnel is not a zero-net-flux exterior; the monopole
  # deflation's physics license does not hold here.
  kernel_monopole_free_single_layer: false
  # MANDATORY at recipe scale for training memory (see base arm).
  kernel_checkpoint_query_chunks: true
  # Reference capacity: one encoder layer, one full-width head.
  operator_scalar_dim: 32
  operator_vector_dim: 8
  drive_scalar_dim: 48
  drive_vector_dim: 12
  operator_layers: 2
  drive_layers: 1
  query_layers: 1
  heads: 1
  scalar_rank: 48
  vector_rank: 16
  query_chunk_size: 65536
  attention_chunk_size: 65536
